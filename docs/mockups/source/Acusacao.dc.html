<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Casos da Lupa – acusação</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px; background: #2B2230; color: #F6EFE0; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px">Casos da Lupa</span>
<span style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #3A2E42; font-size: 18px; font-weight: 800">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#F2B84B" stroke-width="2"></circle><path d="M12 7v5l3 2" fill="none" stroke="#F2B84B" stroke-width="2" stroke-linecap="round"></path></svg>
16:00
</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.1">Quem pegou o bolo? E onde está?</h1>
<span style="font-size: 15px; font-weight: 700; color: #CDBFD2">Carla, combinem com a equipe e escolham os dois.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 800; letter-spacing: 0.08em; color: #CDBFD2">SUSPEITO</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{suspects}}" as="o" hint-placeholder-count="6">
<button type="button" aria-pressed="{{o.pressed}}" disabled="{{o.disabled}}" style="box-sizing: border-box; min-height: 52px; padding: 6px 12px; border-radius: 14px; border: {{o.border}}; background: {{o.bg}}; color: {{o.ink}}; text-align: left; font-family: 'Nunito', system-ui, sans-serif; display: flex; align-items: center; justify-content: space-between; gap: 6px; cursor: pointer">
<span style="display: flex; flex-direction: column">
<span style="font-size: 16px; font-weight: 800; line-height: 1.15; text-decoration: {{o.deco}}">{{o.name}}</span>
<sc-if value="{{o.reason}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; font-weight: 700">{{o.reason}}</span>
</sc-if>
</span>
<sc-if value="{{o.pressed}}" hint-placeholder-val="{{ false }}">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#2B2230" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</sc-if>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 800; letter-spacing: 0.08em; color: #CDBFD2">LUGAR</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{places}}" as="o" hint-placeholder-count="6">
<button type="button" aria-pressed="{{o.pressed}}" disabled="{{o.disabled}}" style="box-sizing: border-box; min-height: 52px; padding: 6px 12px; border-radius: 14px; border: {{o.border}}; background: {{o.bg}}; color: {{o.ink}}; text-align: left; font-family: 'Nunito', system-ui, sans-serif; display: flex; align-items: center; justify-content: space-between; gap: 6px; cursor: pointer">
<span style="display: flex; flex-direction: column">
<span style="font-size: 16px; font-weight: 800; line-height: 1.15; text-decoration: {{o.deco}}">{{o.name}}</span>
<sc-if value="{{o.reason}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; font-weight: 700">{{o.reason}}</span>
</sc-if>
</span>
<sc-if value="{{o.pressed}}" hint-placeholder-val="{{ false }}">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#2B2230" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</sc-if>
</button>
</sc-for>
</div>
</div>
<div style="box-sizing: border-box; background: #F6EFE0; color: #2B2230; border-radius: 14px; padding: 12px 14px; font-size: 15px; line-height: 1.4; font-weight: 700">Se errarem, o relógio avança 1 hora (2 ações) e vocês continuam investigando. Se acertarem, o mistério termina na hora.</div>
<div style="flex: 1"></div>
<button type="button" style="min-height: 64px; border: 0; border-radius: 16px; background: #F2B84B; color: #2B2230; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 19px; line-height: 1.2; padding: 8px 16px; outline: 3px solid #F6EFE0; outline-offset: 3px; cursor: pointer">Acusar Biscoito no Quintal da Lúcia</button>
<button type="button" style="height: 48px; border-radius: 14px; border: 2px solid #8A7790; background: transparent; color: #F6EFE0; font-family: 'Nunito', system-ui, sans-serif; font-size: 16px; font-weight: 800; cursor: pointer">Voltar ao caderno</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const normal = { pressed: false, disabled: false, border: '2px solid #8A7790', bg: 'transparent', ink: '#F6EFE0', deco: 'none', reason: '' };
    const picked = { pressed: true, disabled: false, border: '2px solid #F2B84B', bg: '#F2B84B', ink: '#2B2230', deco: 'none', reason: '' };
    const blocked = (why) => ({ pressed: false, disabled: true, border: '2px dashed #6A5570', bg: '#3A2E42', ink: '#B9A8BF', deco: 'line-through', reason: why });
    return {
      suspects: [
        Object.assign({ name: 'Seu Zé' }, blocked('tem álibi')),
        Object.assign({ name: 'Dona Lúcia' }, normal),
        Object.assign({ name: 'Biscoito' }, picked),
        Object.assign({ name: 'Tião' }, normal),
        Object.assign({ name: 'Profª Rita' }, normal),
        Object.assign({ name: 'Cleo' }, normal)
      ],
      places: [
        Object.assign({ name: 'Padaria' }, normal),
        Object.assign({ name: 'Escola' }, normal),
        Object.assign({ name: 'Mercado' }, blocked('descartado')),
        Object.assign({ name: 'Correio' }, blocked('descartado')),
        Object.assign({ name: 'Quintal da Lúcia' }, picked),
        Object.assign({ name: 'Coreto' }, normal)
      ]
    };
  }
}
</script>
</body>
</html>
