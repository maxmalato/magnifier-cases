<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Casos da Lupa – escolher ação</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px; background: #2B2230; color: #F6EFE0; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px">Casos da Lupa</span>
<span style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #3A2E42; font-size: 18px; font-weight: 800">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#F2B84B" stroke-width="2"></circle><path d="M12 7v5l3 2" fill="none" stroke="#F2B84B" stroke-width="2" stroke-linecap="round"></path></svg>
15:00
</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; gap: 4px">
<sc-for list="{{segs}}" as="seg" hint-placeholder-count="8">
<div style="flex: 1; height: 8px; border-radius: 4px; background: {{seg.bg}}"></div>
</sc-for>
</div>
<span style="font-size: 14px; font-weight: 700; color: #CDBFD2">Restam 6 ações até a festa das 18:00</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.1">Vez de Bruno</h1>
<span style="font-size: 16px; font-weight: 600; color: #E7DDEA">A equipe está na Padaria. O que vocês querem fazer?</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="9">
<div style="min-height: 72px; display: flex">
<sc-if value="{{t.isHere}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; box-sizing: border-box; border-radius: 12px; background: #F6EFE0; color: #2B2230; border: 3px solid #F2B84B; padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; line-height: 1.1">{{t.name}}</span>
<span style="font-size: 14px; font-weight: 800; color: #4A3A52">Equipe aqui</span>
</div>
</sc-if>
<sc-if value="{{t.isOff}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; box-sizing: border-box; border-radius: 12px; background: #3A2E42; border: 2px dashed #8A7790; padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; line-height: 1.1; color: #B9A8BF; text-decoration: line-through">{{t.name}}</span>
<span style="font-size: 14px; font-weight: 800; color: #B9A8BF">descartado</span>
</div>
</sc-if>
<sc-if value="{{t.isPlain}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; box-sizing: border-box; border-radius: 12px; background: #4A3A52; padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; line-height: 1.1">{{t.name}}</span>
<span style="font-size: 14px; font-weight: 700; color: #E7DDEA">{{t.note}}</span>
</div>
</sc-if>
</div>
</sc-for>
</div>
<div style="box-sizing: border-box; background: #F6EFE0; color: #2B2230; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
<button type="button" style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: {{a.border}}; background: {{a.bg}}; color: {{a.ink}}; text-align: left; font-family: 'Nunito', system-ui, sans-serif; cursor: pointer; outline: {{a.ring}}; outline-offset: 2px">
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="{{a.icon}}" fill="none" stroke="{{a.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 17px; font-weight: 800; line-height: 1.1">{{a.title}}</span>
<span style="font-size: 14px; font-weight: 700; opacity: 0.85">{{a.sub}}</span>
</span>
</button>
</sc-for>
</div>
<div style="display: flex; gap: 10px">
<button type="button" style="flex: 1; height: 48px; border-radius: 14px; border: 2px solid #8A7790; background: transparent; color: #F6EFE0; font-family: 'Nunito', system-ui, sans-serif; font-size: 16px; font-weight: 800; cursor: pointer">Abrir caderno</button>
<button type="button" style="flex: 1; height: 48px; border-radius: 14px; border: 2px solid #8A7790; background: transparent; color: #F6EFE0; font-family: 'Nunito', system-ui, sans-serif; font-size: 16px; font-weight: 800; cursor: pointer">Acusar agora</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const segs = [];
    for (let i = 0; i < 8; i++) segs.push({ bg: i < 2 ? '#F2B84B' : '#5A4863' });
    return {
      segs,
      tiles: [
        { name: 'Padaria', isHere: true },
        { name: 'Escola', isPlain: true, note: 'livre' },
        { name: 'Mercado', isPlain: true, note: 'livre' },
        { name: 'Correio', isOff: true },
        { name: 'Praça', isPlain: true, note: 'início' },
        { name: 'Coreto', isPlain: true, note: 'livre' },
        { name: '' },
        { name: 'Quintal da Lúcia', isPlain: true, note: 'livre' },
        { name: '' }
      ],
      actions: [
        { title: 'Investigar a Padaria', sub: '30 min · procurar uma pista aqui', icon: 'M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM15.5 15.5L20 20', bg: '#2B2230', ink: '#F6EFE0', border: '2px solid #2B2230', ring: '3px solid #F2B84B' },
        { title: 'Interrogar alguém', sub: '30 min · escolher um suspeito', icon: 'M4 5h16v11H9l-5 4V5z', bg: 'transparent', ink: '#2B2230', border: '2px solid #8A7790', ring: 'none' },
        { title: 'Ir a outro lugar', sub: '30 min · escolher no mapa', icon: 'M4 12h15M13 6l6 6-6 6', bg: 'transparent', ink: '#2B2230', border: '2px solid #8A7790', ring: 'none' }
      ]
    };
  }
}
</script>
</body>
</html>
